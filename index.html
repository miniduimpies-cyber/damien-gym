<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<link rel='manifest' href='manifest.json'><meta name='theme-color' content='#e53935'><title>Damien Gym</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial;padding:16px}
h1{margin:0}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
button{border:none;border-radius:10px;padding:10px;background:#222;color:#fff;font-weight:bold}
.active{background:#e53935}.card{background:#171717;border-radius:16px;padding:14px}
.row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #333}.small{color:#aaa;font-size:13px}
.bar{height:8px;background:#333;border-radius:99px}.fill{height:100%;background:#22c55e;width:0;border-radius:99px}
</style></head><body><h1>💪 Damien Gym</h1><div id='tabs' class='tabs'></div><div class='card'><h2 id='title'></h2><div id='muscle' style='color:#e53935;font-weight:bold'></div><div id='list'></div><div class='bar'><div id='fill' class='fill'></div></div><div id='pct' class='small'></div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
const w={Mon:['Chest + Triceps',[['Bench','4x6-8'],['Incline DB','3x8-10'],['Chest Fly','3x12-15'],['Pushdown','3x10-12'],['OH Extension','2x12']]],
Tue:['Back + Biceps',[['Lat Pulldown','4x8-10'],['Cable Row','3x10'],['Chest Row','3x10-12'],['Face Pull','3x15'],['EZ Curl','3x10'],['Hammer Curl','2x12']]],
Wed:['Legs',[['Squat','4x6-8'],['RDL','3x8-10'],['Leg Press','3x10'],['Leg Curl','3x12'],['Calf Raise','4x15']]],
Thu:['Shoulders + Abs',[['OHP','4x6-8'],['Lateral Raise','4x12-15'],['Rear Delt','3x15'],['Shrugs','3x12'],['Leg Raise','3x12'],['Plank','3x45-60s']]],
Fri:['Upper Body',[['Incline Bench','3x8'],['Pullup/PD','3x8-10'],['DB Press','3x10'],['Cable Row','3x10'],['Lateral Raise','2x15'],['Curl + Pushdown','2x12']]]};
const order=['Mon','Tue','Wed','Thu','Fri']; const names={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday'};
let cur=order[Math.max(0,Math.min(4,new Date().getDay()-1))]||'Mon';
const key=()=> 'gym_'+cur;
function render(){tabs.innerHTML='';order.forEach(d=>{let b=document.createElement('button');b.textContent=d;b.className=d===cur?'active':'';b.onclick=()=>{cur=d;render()};tabs.appendChild(b)});
let data=w[cur];title.textContent=names[cur];muscle.textContent=data[0];let c=JSON.parse(localStorage.getItem(key())||'[]');list.innerHTML='';let done=0;
data[1].forEach((e,i)=>{if(c[i])done++;let r=document.createElement('div');r.className='row';r.innerHTML=`<input type=checkbox ${c[i]?'checked':''}><div><div>${e[0]}</div><div class=small>${e[1]}</div></div>`;r.querySelector('input').onchange=x=>{c[i]=x.target.checked;localStorage.setItem(key(),JSON.stringify(c));render()};list.appendChild(r)});
let p=Math.round(done/data[1].length*100);fill.style.width=p+'%';pct.textContent=`${done}/${data[1].length} completed (${p}%)`;}
render();
</script></body></html>
