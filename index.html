<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e53935"><title>Damien Gym</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:16px}h1{margin:4px 0 2px;font-size:28px}.sub{color:#999;margin-bottom:14px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}button{border:0;border-radius:10px;padding:10px;background:#222;color:#fff;font-weight:bold}.active{background:#e53935}.card{background:#161616;border-radius:18px;padding:16px}.exercise{padding:14px 0;border-bottom:1px solid #303030}.top{display:flex;align-items:center;gap:10px}.check{width:22px;height:22px;accent-color:#22c55e}.name{font-weight:700;flex:1}.details{color:#aaa;font-size:13px;margin:5px 0 0 32px}.yt{background:#e53935;padding:8px 10px;border-radius:9px;font-size:12px;text-decoration:none;color:white;white-space:nowrap}.bar{height:8px;background:#333;border-radius:99px;margin-top:16px}.fill{height:100%;background:#22c55e;width:0;border-radius:99px}.small{color:#aaa;font-size:13px;margin-top:8px}
</style></head><body><h1>💪 Damien Gym</h1><div class="sub">Your weekly workout</div><div id="tabs" class="tabs"></div>
<div class="card"><h2 id="title"></h2><div id="list"></div><div class="bar"><div id="fill" class="fill"></div></div><div id="pct" class="small"></div></div>
<script>
const workouts={"Mon": ["Chest + Triceps", [["Barbell Bench Press", "4×6–8", "2–3 min"], ["Incline Dumbbell Press", "3×8–10", "90 sec"], ["Chest Fly", "3×12–15", "60 sec"], ["Tricep Pushdown", "3×10–12", "60–90 sec"], ["Overhead Tricep Extension", "2×12", "60 sec"]]], "Tue": ["Back + Biceps", [["Lat Pulldown", "4×8–10", "90 sec"], ["Seated Cable Row", "3×10", "90 sec"], ["Chest-Supported Row", "3×10–12", "90 sec"], ["Face Pull", "3×15", "60 sec"], ["EZ Bar Curl", "3×10", "60–90 sec"], ["Hammer Curl", "2×12", "60 sec"]]], "Wed": ["Legs", [["Squat", "4×6–8", "2–3 min"], ["Romanian Deadlift", "3×8–10", "2 min"], ["Leg Press", "3×10", "90 sec"], ["Leg Curl", "3×12", "60–90 sec"], ["Standing Calf Raise", "4×15", "60 sec"]]], "Thu": ["Shoulders + Abs", [["Overhead Press", "4×6–8", "2–3 min"], ["Lateral Raise", "4×12–15", "60 sec"], ["Rear Delt Fly", "3×15", "60 sec"], ["Shrugs", "3×12", "60–90 sec"], ["Hanging Leg Raise", "3×12", "60 sec"], ["Plank", "3×45–60 sec", "60 sec"]]], "Fri": ["Upper Body", [["Incline Bench Press", "3×8", "90 sec"], ["Pull-ups or Lat Pulldown", "3×8–10", "90 sec"], ["Dumbbell Shoulder Press", "3×10", "90 sec"], ["Cable Row", "3×10", "90 sec"], ["Lateral Raise", "2×15", "60 sec"], ["Bicep Curl + Tricep Pushdown", "2×12 each", "60–90 sec"]]]};const days=["Mon", "Tue", "Wed", "Thu", "Fri"];const names={"Mon": "Monday", "Tue": "Tuesday", "Wed": "Wednesday", "Thu": "Thursday", "Fri": "Friday"};let cur=days[Math.max(0,Math.min(4,new Date().getDay()-1))]||"Mon";
function youtube(n){return "https://www.youtube.com/results?search_query="+encodeURIComponent(n+" how to do exercise proper form")}
function render(){const tabs=document.getElementById("tabs");tabs.innerHTML="";days.forEach(d=>{const b=document.createElement("button");b.textContent=d;b.className=d===cur?"active":"";b.onclick=()=>{cur=d;render()};tabs.appendChild(b)});document.getElementById("title").textContent=names[cur]+" — "+workouts[cur][0];const saved=JSON.parse(localStorage.getItem("gym_"+cur)||"[]"),list=document.getElementById("list");list.innerHTML="";let done=0;workouts[cur][1].forEach((e,i)=>{if(saved[i])done++;const row=document.createElement("div");row.className="exercise";row.innerHTML=`<div class="top"><input class="check" type="checkbox" ${saved[i]?"checked":""}><div class="name">${e[0]}</div><a class="yt" href="${youtube(e[0])}" target="_blank" rel="noopener">▶ YouTube</a></div><div class="details">${e[1]} • Rest ${e[2]}</div>`;row.querySelector(".check").onchange=x=>{saved[i]=x.target.checked;localStorage.setItem("gym_"+cur,JSON.stringify(saved));render()};list.appendChild(row)});const p=Math.round(done/workouts[cur][1].length*100);document.getElementById("fill").style.width=p+"%";document.getElementById("pct").textContent=`${done}/${workouts[cur][1].length} completed (${p}%)`};render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
