<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damien's Gym App</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GymApp = () => {
      const [currentView, setCurrentView] = useState('today');
      const [currentDay, setCurrentDay] = useState(() => {
        const today = new Date().getDay();
        const dayMap = { 1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday', 0: 'monday', 6: 'monday' };
        return dayMap[today];
      });
      
      const [workoutData, setWorkoutData] = useState(() => {
        const saved = localStorage.getItem('gymWorkoutData');
        return saved ? JSON.parse(saved) : initializeWorkoutData();
      });

      const [streak, setStreak] = useState(() => {
        const saved = localStorage.getItem('gymStreak');
        return saved ? JSON.parse(saved) : { count: 0, lastDate: null };
      });

      const [restTimer, setRestTimer] = useState({ active: false, seconds: 0, exercise: '' });

      const workoutPlan = {
        monday: { name: 'Chest + Triceps', exercises: [
          { id: 'bp', name: 'Barbell Bench Press', sets: 4, reps: '6–8', rest: 180 },
          { id: 'idp', name: 'Incline Dumbbell Press', sets: 3, reps: '8–10', rest: 90 },
          { id: 'cf', name: 'Chest Fly', sets: 3, reps: '12–15', rest: 60 },
          { id: 'tp', name: 'Tricep Pushdown', sets: 3, reps: '10–12', rest: 75 },
          { id: 'ote', name: 'Overhead Tricep Extension', sets: 2, reps: '12', rest: 60 }
        ]},
        tuesday: { name: 'Back + Biceps', exercises: [
          { id: 'lp', name: 'Lat Pulldown', sets: 4, reps: '8–10', rest: 90 },
          { id: 'scr', name: 'Seated Cable Row', sets: 3, reps: '10', rest: 90 },
          { id: 'csr', name: 'Chest-Supported Row', sets: 3, reps: '10–12', rest: 90 },
          { id: 'fp', name: 'Face Pull', sets: 3, reps: '15', rest: 60 },
          { id: 'ebc', name: 'EZ Bar Curl', sets: 3, reps: '10', rest: 60 },
          { id: 'hc', name: 'Hammer Curl', sets: 2, reps: '12', rest: 60 }
        ]},
        wednesday: { name: 'Legs', exercises: [
          { id: 'sq', name: 'Squat', sets: 4, reps: '6–8', rest: 180 },
          { id: 'rdl', name: 'Romanian Deadlift', sets: 3, reps: '8–10', rest: 90 },
          { id: 'lpr', name: 'Leg Press', sets: 3, reps: '10', rest: 90 },
          { id: 'lc', name: 'Leg Curl', sets: 3, reps: '12', rest: 60 },
          { id: 'scr2', name: 'Standing Calf Raise', sets: 4, reps: '15', rest: 60 }
        ]},
        thursday: { name: 'Shoulders + Abs', exercises: [
          { id: 'op', name: 'Overhead Press', sets: 4, reps: '6–8', rest: 180 },
          { id: 'lr', name: 'Lateral Raise', sets: 4, reps: '12–15', rest: 60 },
          { id: 'rdf', name: 'Rear Delt Fly', sets: 3, reps: '15', rest: 60 },
          { id: 'sh', name: 'Shrugs', sets: 3, reps: '12', rest: 60 },
          { id: 'hlr', name: 'Hanging Leg Raise', sets: 3, reps: '12', rest: 60 },
          { id: 'pl', name: 'Plank', sets: 3, reps: '45–60 sec', rest: 60 }
        ]},
        friday: { name: 'Upper Body', exercises: [
          { id: 'ib', name: 'Incline Bench', sets: 3, reps: '8', rest: 90 },
          { id: 'pp', name: 'Pull-ups or Pulldown', sets: 3, reps: '8–10', rest: 90 },
          { id: 'dsp', name: 'Dumbbell Shoulder Press', sets: 3, reps: '10', rest: 90 },
          { id: 'cr', name: 'Cable Row', sets: 3, reps: '10', rest: 90 },
          { id: 'lr2', name: 'Lateral Raise', sets: 2, reps: '15', rest: 60 },
          { id: 'combi', name: 'Bicep Curl + Tricep Pushdown', sets: 2, reps: '12 each', rest: 60 }
        ]}
      };

      function initializeWorkoutData() {
        const data = {};
        Object.keys(workoutPlan).forEach(day => {
          data[day] = {
            date: new Date().toISOString().split('T')[0],
            exercises: {},
            completed: false
          };
          workoutPlan[day].exercises.forEach(ex => {
            data[day].exercises[ex.id] = {
              completed: false,
              weight: 0,
              note: ''
            };
          });
        });
        return data;
      }

      useEffect(() => {
        localStorage.setItem('gymWorkoutData', JSON.stringify(workoutData));
      }, [workoutData]);

      useEffect(() => {
        localStorage.setItem('gymStreak', JSON.stringify(streak));
      }, [streak]);

      useEffect(() => {
        if (restTimer.active && restTimer.seconds > 0) {
          const timer = setTimeout(() => {
            setRestTimer(prev => ({ ...prev, seconds: prev.seconds - 1 }));
          }, 1000);
          return () => clearTimeout(timer);
        } else if (restTimer.active && restTimer.seconds === 0) {
          playSound();
          setRestTimer({ ...restTimer, active: false });
        }
      }, [restTimer.active, restTimer.seconds]);

      const playSound = () => {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = 1000;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
      };

      const toggleExercise = (exerciseId) => {
        setWorkoutData(prev => ({
          ...prev,
          [currentDay]: {
            ...prev[currentDay],
            exercises: {
              ...prev[currentDay].exercises,
              [exerciseId]: {
                ...prev[currentDay].exercises[exerciseId],
                completed: !prev[currentDay].exercises[exerciseId].completed
              }
            }
          }
        }));
      };

      const updateWeight = (exerciseId, weight) => {
        setWorkoutData(prev => ({
          ...prev,
          [currentDay]: {
            ...prev[currentDay],
            exercises: {
              ...prev[currentDay].exercises,
              [exerciseId]: {
                ...prev[currentDay].exercises[exerciseId],
                weight: parseFloat(weight)
              }
            }
          }
        }));
      };

      const updateNote = (exerciseId, note) => {
        setWorkoutData(prev => ({
          ...prev,
          [currentDay]: {
            ...prev[currentDay],
            exercises: {
              ...prev[currentDay].exercises,
              [exerciseId]: {
                ...prev[currentDay].exercises[exerciseId],
                note
              }
            }
          }
        }));
      };

      const startTimer = (seconds, exerciseName) => {
        setRestTimer({ active: true, seconds, exercise: exerciseName });
      };

      const completeWorkout = () => {
        setWorkoutData(prev => ({
          ...prev,
          [currentDay]: { ...prev[currentDay], completed: true }
        }));
        
        const today = new Date().toISOString().split('T')[0];
        if (streak.lastDate !== today) {
          setStreak({ count: streak.count + 1, lastDate: today });
        }
      };

      const allExercisesCompleted = Object.values(workoutData[currentDay].exercises).every(ex => ex.completed);

      return (
        <div style={{ background: '#0a0a0a', color: '#fff', minHeight: '100vh', fontFamily: 'system-ui, -apple-system, sans-serif', paddingBottom: '80px' }}>
          <div style={{ background: '#1a1a1a', borderBottom: '2px solid #dc2626', padding: '1rem', position: 'sticky', top: 0, zIndex: 10 }}>
            <h1 style={{ margin: 0, fontSize: '24px', fontWeight: 600, textTransform: 'capitalize' }}>
              💪 {currentDay}
            </h1>
            <p style={{ margin: '0.5rem 0 0', fontSize: '14px', color: '#999' }}>
              🔥 Streak: {streak.count} workouts
            </p>
          </div>

          <div style={{ padding: '1rem' }}>
            {currentView === 'today' && (
              <div>
                <div style={{ background: '#1a1a1a', border: '1px solid #333', borderRadius: '8px', padding: '1rem', marginBottom: '1rem' }}>
                  <h2 style={{ margin: '0 0 0.5rem', fontSize: '18px', color: '#dc2626' }}>
                    {workoutPlan[currentDay].name}
                  </h2>
                  <p style={{ margin: 0, fontSize: '14px', color: '#999' }}>
                    {workoutPlan[currentDay].exercises.length} exercises
                  </p>
                </div>

                {restTimer.active && (
                  <div style={{ background: '#dc2626', border: '2px solid #ff4444', borderRadius: '8px', padding: '1rem', marginBottom: '1rem', textAlign: 'center' }}>
                    <p style={{ margin: '0 0 0.5rem', fontSize: '14px', color: '#000' }}>Rest: {restTimer.exercise}</p>
                    <div style={{ fontSize: '48px', fontWeight: 'bold', color: '#000' }}>
                      {restTimer.seconds}s
                    </div>
                    <button onClick={() => setRestTimer({ ...restTimer, active: false })} style={{ marginTop: '0.5rem', padding: '0.5rem 1rem', background: '#000', color: '#dc2626', border: 'none', borderRadius: '4px', cursor: 'pointer', fontWeight: 'bold' }}>
                      Skip
                    </button>
                  </div>
                )}

                {workoutPlan[currentDay].exercises.map((exercise) => (
                  <div key={exercise.id} style={{ background: '#1a1a1a', border: '1px solid #333', borderRadius: '8px', padding: '1rem', marginBottom: '1rem' }}>
                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: '0.75rem' }}>
                      <input 
                        type="checkbox" 
                        checked={workoutData[currentDay].exercises[exercise.id].completed}
                        onChange={() => toggleExercise(exercise.id)}
                        style={{ width: '20px', height: '20px', marginTop: '2px', cursor: 'pointer' }}
                      />
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                          <h3 style={{ margin: 0, fontSize: '16px', fontWeight: 600, color: workoutData[currentDay].exercises[exercise.id].completed ? '#999' : '#fff' }}>
                            {exercise.name}
                          </h3>
                          <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(exercise.name + ' proper form')}`} target="_blank" rel="noopener noreferrer" style={{ color: '#dc2626', textDecoration: 'none', fontSize: '12px', fontWeight: 'bold' }}>
                            ▶ Form
                          </a>
                        </div>
                        <p style={{ margin: '0 0 0.75rem', fontSize: '14px', color: '#999' }}>
                          {exercise.sets}×{exercise.reps} • Rest {exercise.rest}s
                        </p>
                        
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem', marginBottom: '0.75rem' }}>
                          <input 
                            type="number" 
                            placeholder="Weight (kg)" 
                            value={workoutData[currentDay].exercises[exercise.id].weight || ''}
                            onChange={(e) => updateWeight(exercise.id, e.target.value)}
                            style={{ padding: '0.5rem', background: '#0a0a0a', border: '1px solid #333', borderRadius: '4px', color: '#fff', fontSize: '14px' }}
                          />
                          <button 
                            onClick={() => startTimer(exercise.rest, exercise.name)}
                            style={{ padding: '0.5rem', background: '#dc2626', border: 'none', borderRadius: '4px', color: '#000', fontWeight: 'bold', cursor: 'pointer', fontSize: '14px' }}
                          >
                            ⏱ {exercise.rest}s
                          </button>
                        </div>

                        <input 
                          type="text" 
                          placeholder="Add note..." 
                          value={workoutData[currentDay].exercises[exercise.id].note}
                          onChange={(e) => updateNote(exercise.id, e.target.value)}
                          style={{ width: '100%', padding: '0.5rem', background: '#0a0a0a', border: '1px solid #333', borderRadius: '4px', color: '#fff', fontSize: '13px' }}
                        />
                      </div>
                    </div>
                  </div>
                ))}

                {allExercisesCompleted && !workoutData[currentDay].completed && (
                  <button 
                    onClick={completeWorkout}
                    style={{ width: '100%', padding: '1rem', background: '#dc2626', border: 'none', borderRadius: '8px', color: '#000', fontSize: '16px', fontWeight: 'bold', cursor: 'pointer' }}
                  >
                    🔥 Complete Workout!
                  </button>
                )}

                {workoutData[currentDay].completed && (
                  <div style={{ background: '#166534', border: '2px solid #22c55e', borderRadius: '8px', padding: '1rem', textAlign: 'center', color: '#22c55e' }}>
                    ✓ Workout completed! Awesome work! 💪
                  </div>
                )}
              </div>
            )}

            {currentView === 'select' && (
              <div>
                <p style={{ fontSize: '14px', color: '#999', marginBottom: '1rem' }}>Select your workout:</p>
                {Object.keys(workoutPlan).map(day => (
                  <button 
                    key={day}
                    onClick={() => { setCurrentDay(day); setCurrentView('today'); }}
                    style={{ width: '100%', padding: '1rem', background: '#1a1a1a', border: '1px solid #333', borderRadius: '8px', color: '#fff', fontSize: '16px', fontWeight: 600, marginBottom: '0.75rem', cursor: 'pointer', textTransform: 'capitalize', textAlign: 'left' }}
                  >
                    {day} - {workoutPlan[day].exercises.length} exercises
                  </button>
                ))}
              </div>
            )}

            {currentView === 'history' && (
              <div>
                <p style={{ fontSize: '14px', color: '#999', marginBottom: '1rem' }}>Workout history:</p>
                {Object.keys(workoutData).map(day => (
                  <div key={day} style={{ background: '#1a1a1a', border: '1px solid #333', borderRadius: '8px', padding: '1rem', marginBottom: '0.75rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ textTransform: 'capitalize', fontWeight: 600 }}>{day}</span>
                      <span style={{ color: workoutData[day].completed ? '#22c55e' : '#999' }}>
                        {workoutData[day].completed ? '✓ Completed' : 'Pending'}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#1a1a1a', borderTop: '2px solid #333', display: 'flex', justifyContent: 'space-around', padding: '0.75rem 0' }}>
            <button 
              onClick={() => setCurrentView('today')}
              style={{ flex: 1, padding: '0.75rem', background: currentView === 'today' ? '#dc2626' : 'transparent', border: 'none', color: '#fff', fontWeight: 'bold', cursor: 'pointer', fontSize: '12px' }}
            >
              Today
            </button>
            <button 
              onClick={() => setCurrentView('select')}
              style={{ flex: 1, padding: '0.75rem', background: currentView === 'select' ? '#dc2626' : 'transparent', border: 'none', color: '#fff', fontWeight: 'bold', cursor: 'pointer', fontSize: '12px' }}
            >
              Plan
            </button>
            <button 
              onClick={() => setCurrentView('history')}
              style={{ flex: 1, padding: '0.75rem', background: currentView === 'history' ? '#dc2626' : 'transparent', border: 'none', color: '#fff', fontWeight: 'bold', cursor: 'pointer', fontSize: '12px' }}
            >
              History
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GymApp />);
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</body>
</html>
